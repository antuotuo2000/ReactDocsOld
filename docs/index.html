<!DOCTYPE html>
<html lang="zh-CN" data-mui-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>王安安的数据中心</title>
  <style>
    /* Material-UI v4.12.4 Official Theme Tokens (createMuiTheme defaults) */
    :root,
    html[data-mui-theme="light"] {
      --mui-primary-main: #1976d2;
      --mui-primary-dark: #115293;
      --mui-primary-light: #4791db;
      --mui-primary-tint: rgba(25, 118, 210, 0.08);
      --mui-primary-tint-strong: rgba(25, 118, 210, 0.15);
      --mui-secondary-main: #dc004e;
      --mui-appbar-bg: #1976d2;
      --mui-appbar-text: #ffffff;
      --mui-bg-default: #fafafa;
      --mui-bg-paper: #ffffff;
      --mui-bg-card: #ffffff;
      --mui-bg-level2: #f5f5f5;
      --mui-text-primary: rgba(0, 0, 0, 0.87);
      --mui-text-secondary: rgba(0, 0, 0, 0.54);
      --mui-text-hint: rgba(0, 0, 0, 0.38);
      --mui-divider: rgba(0, 0, 0, 0.12);
      --mui-action-hover: rgba(0, 0, 0, 0.04);
      --mui-action-selected: rgba(25, 118, 210, 0.08);
      --mui-chip-bg: #e0e0e0;
      --mui-mark-bg: #fff59d;
      --mui-mark-text: rgba(0, 0, 0, 0.87);
      --mui-shadow-1: 0px 2px 1px -1px rgba(0,0,0,0.2), 0px 1px 1px 0px rgba(0,0,0,0.14), 0px 1px 3px 0px rgba(0,0,0,0.12);
      --mui-shadow-2: 0px 3px 1px -2px rgba(0,0,0,0.2), 0px 2px 2px 0px rgba(0,0,0,0.14), 0px 1px 5px 0px rgba(0,0,0,0.12);
      --mui-shadow-4: 0px 2px 4px -1px rgba(0,0,0,0.2), 0px 4px 5px 0px rgba(0,0,0,0.14), 0px 1px 10px 0px rgba(0,0,0,0.12);
      --mui-shadow-16: 0px 8px 10px -5px rgba(0,0,0,0.2), 0px 16px 24px 2px rgba(0,0,0,0.14), 0px 6px 30px 5px rgba(0,0,0,0.12);
    }

    html[data-mui-theme="dark"] {
      --mui-primary-main: #90caf9;
      --mui-primary-dark: #42a5f5;
      --mui-primary-light: #e3f2fd;
      --mui-primary-tint: rgba(144, 202, 249, 0.12);
      --mui-primary-tint-strong: rgba(144, 202, 249, 0.22);
      --mui-secondary-main: #f48fb1;
      --mui-appbar-bg: #1d1d1d;
      --mui-appbar-text: #ffffff;
      --mui-bg-default: #121212;
      --mui-bg-paper: #212121;
      --mui-bg-card: #424242;
      --mui-bg-level2: #333333;
      --mui-text-primary: #ffffff;
      --mui-text-secondary: rgba(255, 255, 255, 0.7);
      --mui-text-hint: rgba(255, 255, 255, 0.5);
      --mui-divider: rgba(255, 255, 255, 0.09);
      --mui-action-hover: rgba(255, 255, 255, 0.06);
      --mui-action-selected: rgba(144, 202, 249, 0.14);
      --mui-chip-bg: #333333;
      --mui-mark-bg: rgba(255, 245, 157, 0.28);
      --mui-mark-text: #fff59d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Roboto", "Helvetica", "Arial", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 0.875rem;
      font-weight: 400;
      line-height: 1.43;
      letter-spacing: 0.01071em;
      background-color: var(--mui-bg-default);
      color: var(--mui-text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 200ms cubic-bezier(0.4, 0, 0.2, 1), color 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mono {
      font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    mark {
      background-color: var(--mui-mark-bg);
      color: var(--mui-mark-text);
      padding: 0 2px;
      border-radius: 2px;
      font-weight: 500;
    }

    .hidden { display: none !important; }

    /* Material Ripple Effect */
    .mui-ripple-host {
      position: relative;
      overflow: hidden;
    }

    .mui-ripple-wave {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      animation: mui-ripple-anim 550ms cubic-bezier(0.4, 0, 0.2, 1);
      background-color: currentColor;
      opacity: 0.24;
      pointer-events: none;
    }

    @keyframes mui-ripple-anim {
      to {
        transform: scale(3.5);
        opacity: 0;
      }
    }

    /* MuiAppBar Sticky Top (full-width on both PC & mobile; left Drawer hidden by default) */
    .MuiAppBar-root {
      position: sticky;
      top: 0;
      margin-left: 0;
      min-height: 64px;
      z-index: 1100;
      background-color: var(--mui-appbar-bg);
      color: var(--mui-appbar-text);
      box-shadow: var(--mui-shadow-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      gap: 16px;
      transition: background-color 200ms ease;
    }

    .MuiAppBar-topBar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .mobile-brand-title {
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .MuiSelect-pair {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      flex-wrap: wrap;
    }

    .MuiDrawer-actionGrid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .MuiIconButton-appbar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 0;
      background: transparent;
      color: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 150ms cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
    }

    .MuiIconButton-appbar:hover {
      background-color: rgba(255, 255, 255, 0.12);
    }

    .mobile-menu-btn {
      display: inline-flex;
    }

    /* Official Material-UI v4 Primary Search AppBar Input (fade(white, 0.15) -> 0.25) */
    .MuiSearch-root {
      position: relative;
      border-radius: 4px;
      background-color: rgba(255, 255, 255, 0.15);
      transition: background-color 200ms cubic-bezier(0.4, 0, 0.2, 1), width 250ms cubic-bezier(0.4, 0, 0.2, 1);
      flex: 1;
      max-width: 560px;
      height: 40px;
      display: flex;
      align-items: center;
    }

    .MuiSearch-root:hover,
    .MuiSearch-root:focus-within {
      background-color: rgba(255, 255, 255, 0.24);
    }

    .MuiSearch-icon {
      padding: 0 12px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      color: rgba(255, 255, 255, 0.9);
    }

    .MuiSearch-input {
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.92rem;
      padding-right: 112px;
    }

    .MuiSearch-input::placeholder {
      color: rgba(255, 255, 255, 0.74);
    }

    .MuiSearch-suffix {
      position: absolute;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      color: rgba(255, 255, 255, 0.88);
    }

    .MuiKbd {
      padding: 2px 6px;
      border-radius: 3px;
      background-color: rgba(0, 0, 0, 0.2);
      font-size: 0.72rem;
      font-weight: 500;
    }

    .MuiAppBar-spacer {
      display: none;
    }

    .MuiAppBar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .MuiAppBar-btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.38);
      background: transparent;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.02857em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      outline: none;
      transition: background-color 150ms ease, border-color 150ms ease;
    }

    .MuiAppBar-btn:hover {
      background-color: rgba(255, 255, 255, 0.12);
      border-color: #ffffff;
    }

    .MuiAppBar-btn option {
      background-color: var(--mui-bg-paper);
      color: var(--mui-text-primary);
    }

    /* v4.mui.com/zh/ Left MuiDrawer: hidden by default on PC & mobile; slides in cleanly when toggled */
    .MuiDrawer-docked {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 256px;
      z-index: 1250;
      background-color: var(--mui-bg-paper);
      border-right: 1px solid var(--mui-divider);
      display: flex;
      flex-direction: column;
      transform: translateX(-105%);
      box-shadow: none;
      transition: transform 225ms cubic-bezier(0, 0, 0.2, 1), background-color 200ms ease;
    }

    .MuiDrawer-docked.mobile-open {
      transform: translateX(0);
      box-shadow: var(--mui-shadow-16);
    }

    @media (min-width: 960px) {
      body.pc-drawer-open .MuiDrawer-docked {
        transform: translateX(0);
        box-shadow: none;
      }
      body.pc-drawer-open .MuiAppBar-root,
      body.pc-drawer-open .MuiMain-root {
        margin-left: 256px;
      }
    }

    .MuiDrawer-toolbarHeader {
      min-height: 64px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--mui-divider);
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-shrink: 0;
    }

    .MuiDrawer-titleText {
      font-size: 1.125rem;
      font-weight: 500;
      color: var(--mui-text-secondary);
      line-height: 1.3;
      text-decoration: none;
      letter-spacing: 0.0075em;
    }

    .MuiDrawer-titleText:hover {
      color: var(--mui-primary-main);
      text-decoration: underline;
    }

    .MuiDrawer-version {
      font-size: 0.75rem;
      color: var(--mui-text-hint);
      margin-top: 3px;
    }

    .MuiDrawer-navScroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0 32px;
    }

    /* Authentic v4.mui.com/zh/ Multi-Level Indented Typography Navigation (no icons, no badges, no guide lines) */
    .MuiDrawer-list,
    .MuiNav-sublist {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .MuiNav-btn,
    .MuiNav-leafLink {
      display: block;
      width: 100%;
      border: 0;
      background: transparent;
      font-family: inherit;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      line-height: 1.45;
      letter-spacing: 0.01071em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background-color 150ms cubic-bezier(0.4, 0, 0.2, 1), color 150ms ease;
    }

    .MuiNav-btn:hover,
    .MuiNav-leafLink:hover {
      background-color: var(--mui-action-hover);
      color: var(--mui-text-primary);
    }

    /* Level 1: Top-level section (e.g. Customization 个性化 / Apple / Google) */
    .MuiNav-lvl1 {
      padding: 8px 16px 8px 24px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--mui-text-primary);
    }

    /* Level 2: Sub-category (e.g. Theming 主题 / hardware 硬件产品) */
    .MuiNav-lvl2 {
      padding: 6.5px 16px 6.5px 40px;
      font-size: 0.855rem;
      font-weight: 500;
      color: var(--mui-text-primary);
    }

    /* Level 3: Nested topic folder or direct report leaf (e.g. Overview 概览 / Palette 调色) */
    .MuiNav-lvl3 {
      padding: 6px 16px 6px 56px;
      font-size: 0.84rem;
      font-weight: 400;
      color: var(--mui-text-secondary);
    }

    /* Level 4: Deep leaf report inside L3 topic folder */
    .MuiNav-lvl4 {
      padding: 5.5px 16px 5.5px 72px;
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--mui-text-secondary);
    }

    .MuiNav-active {
      color: var(--mui-primary-main) !important;
      font-weight: 500 !important;
    }

    .MuiDrawer-badge {
      font-size: 0.72rem;
      color: var(--mui-text-secondary);
      padding: 1px 6px;
      border-radius: 10px;
      background-color: var(--mui-bg-level2);
    }

    /* Main Content Container */
    .MuiMain-root {
      margin-left: 0;
      padding: 24px 24px 64px;
      transition: margin-left 225ms cubic-bezier(0, 0, 0.2, 1);
    }

    .MuiContainer-maxWidthLg {
      max-width: 1120px;
      margin: 0 auto;
    }

    /* MuiPaper Surface */
    .MuiPaper-elevation1 {
      background-color: var(--mui-bg-paper);
      color: var(--mui-text-primary);
      border-radius: 4px;
      box-shadow: var(--mui-shadow-1);
      transition: box-shadow 300ms cubic-bezier(0.4, 0, 0.2, 1), background-color 200ms ease;
    }

    .MuiPaper-outlined {
      background-color: var(--mui-bg-paper);
      border: 1px solid var(--mui-divider);
      border-radius: 4px;
    }

    /* Top Tabs + Chips Header Card */
    .MuiHeaderCard {
      margin-bottom: 20px;
      overflow: hidden;
    }

    .MuiTabs-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--mui-divider);
      padding: 0 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .MuiTabs-flexContainer {
      display: flex;
      align-items: center;
    }

    .MuiTab-root {
      position: relative;
      min-height: 48px;
      padding: 12px 18px;
      border: 0;
      background: transparent;
      color: var(--mui-text-secondary);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.02857em;
      cursor: pointer;
      transition: color 150ms ease, background-color 150ms ease;
    }

    .MuiTab-root:hover {
      color: var(--mui-text-primary);
      background-color: var(--mui-action-hover);
    }

    .MuiTab-root.Mui-selected {
      color: var(--mui-primary-main);
    }

    .MuiTab-root.Mui-selected::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background-color: var(--mui-primary-main);
    }

    .MuiFilterRow {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background-color: var(--mui-bg-paper);
    }

    /* Authentic Material-UI v4 MuiChip (height: 32px, border-radius: 16px) */
    .MuiChip-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .MuiChip-root {
      height: 30px;
      padding: 0 11px;
      border-radius: 15px;
      border: 1px solid var(--mui-divider);
      background-color: transparent;
      color: var(--mui-text-primary);
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 400;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: background-color 150ms cubic-bezier(0.4, 0, 0.2, 1), border-color 150ms ease, color 150ms ease;
    }

    .MuiChip-root:hover {
      background-color: var(--mui-action-hover);
    }

    .MuiChip-root.MuiChip-colorPrimary {
      background-color: var(--mui-primary-main);
      border-color: var(--mui-primary-main);
      color: var(--mui-bg-paper);
      font-weight: 500;
    }

    html[data-mui-theme="light"] .MuiChip-root.MuiChip-colorPrimary {
      color: #ffffff;
    }

    html[data-mui-theme="dark"] .MuiChip-root.MuiChip-colorPrimary {
      color: rgba(0, 0, 0, 0.87);
    }

    .MuiChip-count {
      font-size: 0.74rem;
      opacity: 0.78;
    }

    /* Outlined Material Select */
    .MuiOutlinedSelect {
      height: 34px;
      padding: 0 10px;
      border-radius: 4px;
      border: 1px solid var(--mui-divider);
      background-color: var(--mui-bg-paper);
      color: var(--mui-text-primary);
      font-family: inherit;
      font-size: 0.8125rem;
      outline: none;
      cursor: pointer;
    }

    .MuiOutlinedSelect:focus {
      border-color: var(--mui-primary-main);
      box-shadow: inset 0 0 0 1px var(--mui-primary-main);
    }

    /* Material Buttons (4px border-radius, subtle uppercase/500 weight, elevation) */
    .MuiButton-root {
      height: 32px;
      padding: 0 12px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.02857em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 200ms cubic-bezier(0.4, 0, 0.2, 1), box-shadow 200ms cubic-bezier(0.4, 0, 0.2, 1), border-color 200ms ease;
    }

    .MuiButton-outlined {
      border: 1px solid var(--mui-divider);
      background-color: transparent;
      color: var(--mui-text-primary);
    }

    .MuiButton-outlined:hover {
      background-color: var(--mui-action-hover);
      border-color: var(--mui-text-secondary);
    }

    .MuiButton-outlinedPrimary {
      border: 1px solid rgba(25, 118, 210, 0.5);
      background-color: transparent;
      color: var(--mui-primary-main);
    }

    html[data-mui-theme="dark"] .MuiButton-outlinedPrimary {
      border-color: rgba(144, 202, 249, 0.5);
    }

    .MuiButton-outlinedPrimary:hover {
      background-color: var(--mui-primary-tint);
      border-color: var(--mui-primary-main);
    }

    .MuiButton-containedPrimary {
      border: 0;
      background-color: var(--mui-primary-main);
      color: #ffffff;
      box-shadow: var(--mui-shadow-2);
    }

    html[data-mui-theme="dark"] .MuiButton-containedPrimary {
      color: rgba(0, 0, 0, 0.87);
    }

    .MuiButton-containedPrimary:hover {
      background-color: var(--mui-primary-dark);
      box-shadow: var(--mui-shadow-4);
    }


    /* Authentic Material-UI v4 RecipeReviewCard Grid & Expandable Card (https://v4.mui.com/zh/components/cards/) */
    .MuiCardGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 20px;
      align-items: start;
    }

    .MuiCard-root {
      background-color: var(--mui-bg-card);
      color: var(--mui-text-primary);
      border-radius: 4px;
      box-shadow: var(--mui-shadow-1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow 250ms cubic-bezier(0.4, 0, 0.2, 1), background-color 200ms ease;
    }

    .MuiCard-root:hover {
      box-shadow: var(--mui-shadow-4);
    }

    .MuiCardHeader-root {
      display: flex;
      align-items: center;
      padding: 14px 16px 8px;
      gap: 13px;
    }

    .MuiCardHeader-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #f44336;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-decoration: none;
    }

    .avatar-bg-SeniorExecutive { background-color: #f44336; }
    .avatar-bg-Company { background-color: #1976d2; }
    .avatar-bg-CorporateCulture { background-color: #8e24aa; }
    .avatar-bg-software { background-color: #00897b; }
    .avatar-bg-hardware { background-color: #e64a19; }
    .avatar-bg-patent { background-color: #0097a7; }
    .avatar-bg-Portal, .avatar-bg-System { background-color: #616161; }

    .MuiCardHeader-content {
      flex: 1 1 auto;
      min-width: 0;
    }

    .MuiCardHeader-title {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.43;
      color: var(--mui-text-primary);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .MuiCardHeader-title:hover {
      color: var(--mui-primary-main);
    }

    .MuiCardHeader-subheader {
      display: block;
      font-size: 0.8125rem;
      line-height: 1.43;
      color: var(--mui-text-secondary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .MuiCardHeader-action {
      flex: 0 0 auto;
      margin-right: -8px;
    }

    /* Full-bleed 16:9 CardMedia Cover Visual */
    .MuiCardMedia-root {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 162px;
      padding: 16px 18px;
      text-decoration: none;
      color: #ffffff;
      overflow: hidden;
    }

    .media-bg-SeniorExecutive { background: linear-gradient(135deg, #2b102f 0%, #7b1fa2 52%, #d84315 100%); }
    .media-bg-Company { background: linear-gradient(135deg, #0d2137 0%, #1565c0 55%, #00838f 100%); }
    .media-bg-CorporateCulture { background: linear-gradient(135deg, #1f1c2c 0%, #4a148c 55%, #311b92 100%); }

      function countFolderFiles(fid) {
        var n = folderNodes[fid];

          var it = itemById[id];

        });
        n.children.forEach(function (cid) { c += countFolderFiles(cid); });
        return c;
      }

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function highlight(text, tokens) {
        var safe = esc(text);
        if (!tokens || !tokens.length) return safe;
        var pat = tokens.slice().sort(function (a, b) { return b.length - a.length; }).map(function (t) {
          return esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }).join('|');
        if (!pat) return safe;
        try {
          return safe.replace(new RegExp('(' + pat + ')', 'gi'), '<mark>$1</mark>');
        } catch (e) {
          return safe;
        }
      }

      function fmtSize(b) {
        var n = Number(b) || 0;
        if (!n) return '';
        if (n < 1024) return n + ' B';
        if (n < 1048576) return (n / 1024).toFixed(0) + ' KB';
        return (n / 1048576).toFixed(2) + ' MB';
      }

      function encodeRel(rel) {
        return './' + String(rel).split('/').map(encodeURIComponent).join('/');
      }

      function resolveUrl(item) {
        return isLocalEnv() ? encodeRel(item.relPath) : item.driveUrl;

      function toast(msg) {
        var wrap = document.getElementById('toastContainer');
        var el = document.createElement('div');
        el.className = 'MuiSnackbarContent-root';
        el.textContent = msg;
        wrap.appendChild(el);
        window.setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 2500);
      }

      function copyPath(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            toast('已复制链接：' + text);
          }).catch(function () { fallbackCopy(text); });
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); toast('已复制链接：' + text); } catch (e) {}
        document.body.removeChild(ta);
      }

      function spawnRipple(host, ev) {
        var rect = host.getBoundingClientRect();
        var d = Math.max(rect.width, rect.height);
        var wave = document.createElement('span');
        wave.className = 'mui-ripple-wave';
        wave.style.width = d + 'px';
        wave.style.height = d + 'px';
        wave.style.left = (ev.clientX - rect.left - d / 2) + 'px';
        wave.style.top = (ev.clientY - rect.top - d / 2) + 'px';
        host.appendChild(wave);
        window.setTimeout(function () {
          if (wave.parentNode) wave.parentNode.removeChild(wave);
        }, 600);
      }

      function getTokens() {
        var q = state.query.trim().toLowerCase();
        return q ? q.split(/\s+/).filter(Boolean) : [];
      }

      function findContentHit(item, tokens) {
        if (!tokens.length) return '';
        var titleAndPath = (item.title + ' ' + item.relPath + ' ' + item.company + ' ' + item.companyLabel + ' ' + item.ticker).toLowerCase();
        var source = (item.headings || []).join(' · ') + ' ' + (item.summary || '') + ' ' + (item.excerpt || '');
        if (!source) return '';
        var lower = source.toLowerCase();
        for (var i = 0; i < tokens.length; i++) {
          var tok = tokens[i];
          var idx = lower.indexOf(tok);
          if (idx !== -1 && titleAndPath.indexOf(tok) === -1) {
            var s = Math.max(0, idx - 28);
            var e = Math.min(source.length, idx + 76);
            return (s > 0 ? '…' : '') + source.slice(s, e).trim() + (e < source.length ? '…' : '');
          }
        }
        return '';
      }

      function getFiltered() {
        var tokens = getTokens();
        var explicitSysQuery = tokens.some(function (t) {
          return t === 'index' || t === 'index.html' || t.indexOf('ds_store') !== -1;
        });
        var list = allItems.filter(function (it) {
          if (!state.includeSystem && !explicitSysQuery && (it.isPortalIndex || it.isSystem)) return false;
          if (state.category === 'FAV') {
            if (!state.favorites[it.id]) return false;
          } else if (state.category !== 'ALL' && it.category !== state.category) {
            return false;
          }
          if (state.company !== 'ALL' && it.company !== state.company) return false;
          if (tokens.length) {
            var hay = it._hay || '';
            for (var i = 0; i < tokens.length; i++) {
              if (hay.indexOf(tokens[i]) === -1) return false;
            }
          }
          return true;
        });

        list.sort(function (a, b) {
          if (state.sort === 'time_desc') return String(b.modifiedTime).localeCompare(String(a.modifiedTime));
          if (state.sort === 'company_asc') {
            var c = String(a.company).localeCompare(String(b.company), 'zh-CN');
            return c !== 0 ? c : String(a.title).localeCompare(String(b.title), 'zh-CN');
          }
          return String(a.title).localeCompare(String(b.title), 'zh-CN');
        });
        return list;
      }

      function getMatchingFolders(tokens) {
        if (!tokens.length) return [];
        var out = [];
        Object.keys(folderNodes).forEach(function (fid) {
          if (fid === CATALOG.root.id) return;
          var n = folderNodes[fid];
          var hay = (n.name + ' ' + (n.label || '') + ' ' + (n.ticker || '') + ' ' + n.relPath).toLowerCase();
          if (tokens.every(function (t) { return hay.indexOf(t) !== -1; })) out.push(n);
        });
        out.sort(function (a, b) { return a.level !== b.level ? a.level - b.level : a.relPath.localeCompare(b.relPath); });
        return out.slice(0, 8);
      }

      function shortReportLabel(it) {
        var t = String(it.title || it.name || '');
        var colonIdx = t.indexOf('：');
        if (colonIdx === -1) colonIdx = t.indexOf(':');
        if (colonIdx > 4) t = t.slice(0, colonIdx);
        t = t.replace(/\([^)]*\)/g, ' ')
             .replace(/深度[\u4e00-\u9fa5A-Za-z0-9\s]*报告/g, '')
             .replace(/\s+/g, ' ')
             .trim();
        return t || it.name.replace(/\.html?$/i, '');
      }

      function cleanCompanyNavLabel(c) {
        if (c.folder === '默认文件夹') return '默认文件夹';
        var prettyEn = c.folder
          .replace('BendingSpoonsS.p.A', 'Bending Spoons')
          .replace('BerkshireHathaway-B', 'Berkshire')
          .replace('CerebrasSystems', 'Cerebras')
          .replace('CredoTechnology', 'Credo')
          .replace('HimalayaCapitalManagement', 'Himalaya')
          .replace('InvescoQQQTrust', 'Invesco QQQ')
          .replace('SPDRS&P500ETF', 'SPDR S&P 500')
          .replace('TencentMusic', 'Tencent Music')
          .replace('WesternDigital', 'Western Digital')
          .replace('LennarCorp', 'Lennar')
          .replace('RocketLab', 'Rocket Lab')
          .replace('TempusAI', 'Tempus AI')
          .replace('DuanYongping', 'Duan Yongping');
        var zh = String(c.label || '').replace(/[A-Za-z0-9.&/\-()\s]+/g, '').replace(/^(公司|集团|控股)+|(公司|集团|控股)+$/g, '').trim();
        return zh ? (prettyEn + ' ' + zh) : prettyEn;
      }

      function renderNavSubtree(folderId, depth) {
        var node = folderNodes[folderId];
        if (!node) return '';
        var subItemsHtml = '';

        // Child folders (populate non-empty ones first; if entire company is empty like 默认文件夹, show standard 7 dims)
        node.children.forEach(function (cid) {
          var child = folderNodes[cid];
          if (!child) return;
          var cnt = countFolderFiles(cid);
          var parentCnt = countFolderFiles(folderId);
          if (cnt === 0 && parentCnt > 0) return;

          var expKey = child.relPath;
          var isOpen = !!state.navOpen[expKey];
          var biLabel = (child.level === 2 && CAT_LABELS[child.name])
            ? (child.name + ' ' + CAT_LABELS[child.name])
            : child.name;
          var lvlClass = depth === 2 ? 'MuiNav-lvl2' : 'MuiNav-lvl3';
          var isAct = (child.level === 2 && state.company === expKey.split('/')[0] && state.category === child.name);

          subItemsHtml += '<li>' +
            '<button type="button" class="MuiNav-btn ' + lvlClass + (isAct ? ' MuiNav-active' : '') + ' mui-ripple-host" data-nav-folder="' + esc(cid) + '" data-nav-key="' + esc(expKey) + '">' +
              esc(biLabel) +
            '</button>' +
            (isOpen ? renderNavSubtree(cid, Math.min(4, depth + 1)) : '') +
          '</li>';
        });

        // Direct HTML reports inside this folder
        node.files.forEach(function (fid) {
          var it = itemById[fid];
          if (!it || it.isPortalIndex || it.isSystem) return;
          var href = resolveUrl(it);
          var leafClass = depth <= 2 ? 'MuiNav-lvl2' : (depth === 3 ? 'MuiNav-lvl3' : 'MuiNav-lvl4');
          subItemsHtml += '<li>' +
            '<a class="MuiNav-leafLink ' + leafClass + ' mui-ripple-host" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer" data-nav-leaf="1" title="' + esc(it.title) + '">' +
              esc(shortReportLabel(it)) +
            '</a>' +
          '</li>';
        });

        return subItemsHtml ? '<ul class="MuiNav-sublist">' + subItemsHtml + '</ul>' : '';
      }

      function renderSidebar() {
        var ul = document.getElementById('sidebarCompanyLinks');
        if (!ul) return;
        var allAct = (state.company === 'ALL' && state.category === 'ALL') ? ' MuiNav-active' : '';
        var html = '<li><button type="button" class="MuiNav-btn MuiNav-lvl1' + allAct + ' mui-ripple-host" data-side-comp="ALL">全部文档 Overview</button></li>';

        CATALOG.companies.forEach(function (c) {
          var isOpen = !!state.navOpen[c.folder];
          var compLabel = cleanCompanyNavLabel(c);
          var isAct = (state.company === c.folder && state.category === 'ALL') ? ' MuiNav-active' : '';
          html += '<li>' +
            '<button type="button" class="MuiNav-btn MuiNav-lvl1' + isAct + ' mui-ripple-host" data-nav-company="' + esc(c.folder) + '">' +
              esc(compLabel) +
            '</button>' +
            (isOpen ? renderNavSubtree(c.id, 2) : '') +
          '</li>';
        });

        ul.innerHTML = html;
      }

      function renderCategoryTabs() {
        var pool = allItems.filter(function (it) {
          return (state.includeSystem || (!it.isPortalIndex && !it.isSystem)) &&
                 (state.company === 'ALL' || it.company === state.company);
        });
        var counts = { ALL: pool.length };
        pool.forEach(function (it) { counts[it.category] = (counts[it.category] || 0) + 1; });

        var favCnt = pool.filter(function (it) { return !!state.favorites[it.id]; }).length;
        counts.FAV = favCnt;
        CAT_LABELS.FAV = '★ 收藏';

        var cats = ['ALL', 'SeniorExecutive', 'Company', 'CorporateCulture', 'software', 'hardware', 'patent'];
        if (favCnt > 0 || state.category === 'FAV') cats.push('FAV');

        document.getElementById('categoryTabs').innerHTML = cats.map(function (c) {
          var cnt = counts[c] || 0;
          var cls = 'MuiChip-root mui-ripple-host' + (state.category === c ? ' MuiChip-colorPrimary' : '');
          return '<button type="button" class="' + cls + '" data-cat="' + c + '">' +
            '<span>' + esc(CAT_LABELS[c]) + '</span><span class="MuiChip-count mono">' + cnt + '</span></button>';
        }).join('');
      }

      function splitCardHeadline(it) {
        var full = String(it.title || it.name || '');
        var idx = full.indexOf('：');
        if (idx === -1) idx = full.indexOf(':');
        if (idx > 3 && idx < full.length - 2) {
          return {
            head: full.slice(0, idx).trim(),
            subThesis: full.slice(idx + 1).trim()
          };
        }
        return { head: shortReportLabel(it), subThesis: full };
      }

      function renderFileCard(it, tokens) {
        var href = resolveUrl(it);
        var hit = findContentHit(it, tokens);
        var catName = CAT_LABELS[it.category] || it.category;
        var dateStr = String(it.modifiedTime || '').slice(0, 10) || '2026-11';
        var parts = splitCardHeadline(it);
        var initial = String(it.ticker || it.company || 'D').replace(/[^A-Za-z0-9\u4e00-\u9fa5]/g, '').slice(0, 1).toUpperCase() || 'D';
        var isFav = !!state.favorites[it.id];
        var isExp = !!state.expandedCards[it.id];
        var summaryText = it.summary || it.title;
        var watermark = (it.ticker && it.ticker !== 'TEMPLATE' && it.ticker !== 'INDEX') ? it.ticker : it.company.slice(0, 5).toUpperCase();

        var tocItems = (it.headings && it.headings.length)
          ? '<ul class="MuiCollapse-tocList">' + it.headings.slice(0, 6).map(function (h) {
              return '<li>' + highlight(h, tokens) + '</li>';
            }).join('') + '</ul>'
          : '<div style="margin:8px 0 12px;">点击下方按钮在新标签页阅读完整报告内容。</div>';

        return '<article class="MuiCard-root" data-card-root="' + esc(it.id) + '">' +
          /* 1. CardMedia: Full-bleed Top Visual Cover Banner */
          '<a class="MuiCardMedia-root media-bg-' + esc(it.category) + '" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' +
            '<span class="MuiCardMedia-watermark mono">' + esc(watermark) + '</span>' +
            '<svg class="MuiCardMedia-curve" viewBox="0 0 400 160" preserveAspectRatio="none"><path d="M0,128 Q95,68 190,104 T400,42 L400,160 L0,160 Z" fill="rgba(255,255,255,0.12)"/><path d="M0,145 Q130,95 250,122 T400,78" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"/></svg>' +
            '<div class="MuiCardMedia-topRow">' +
              '<span class="MuiCardMedia-tag mono">' + highlight(it.ticker || it.company, tokens) + '</span>' +
              '<span class="MuiCardMedia-tag">' + esc(catName) + '</span>' +
            '</div>' +
            '<div class="MuiCardMedia-headline">' + highlight(parts.subThesis, tokens) + '</div>' +
          '</a>' +

          /* 2. CardHeader (Moved below CardMedia): Avatar + Title/Date + MoreVert (⋮) */
          '<div class="MuiCardHeader-root">' +
            '<a class="MuiCardHeader-avatar avatar-bg-' + esc(it.category) + '" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer" aria-label="打开报告">' + esc(initial) + '</a>' +
            '<div class="MuiCardHeader-content">' +
              '<a class="MuiCardHeader-title" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer" title="' + esc(it.title) + '">' + highlight(parts.head, tokens) + '</a>' +
              '<span class="MuiCardHeader-subheader">' + esc(dateStr) + ' · ' + highlight(it.company, tokens) + ' · ' + esc(catName) + '</span>' +
            '</div>' +
            '<div class="MuiCardHeader-action">' +
              '<button type="button" class="MuiIconButton-card mui-ripple-host" data-drawer-id="' + esc(it.id) + '" aria-label="更多详情与大纲" title="侧边预览详情">' +
                '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>' +
              '</button>' +
            '</div>' +
          '</div>' +

          /* 3. CardContent: 3-line Executive Summary */
          '<div class="MuiCardContent-root">' +
            '<div class="MuiCardContent-summary">' + highlight(summaryText, tokens) + '</div>' +
            (hit ? '<div class="MuiSnippetBox">命中：' + highlight(hit, tokens) + '</div>' : '') +
          '</div>' +

          /* 4. CardActions: Favorite (♥) + Share + OpenInNew + ExpandMore (⌄) */
          '<div class="MuiCardActions-root">' +
            '<button type="button" class="MuiIconButton-card mui-ripple-host" data-star-id="' + esc(it.id) + '" aria-label="收藏" title="收藏报告" style="' + (isFav ? 'color:#f44336;' : '') + '">' +
              '<svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>' +
            '</button>' +
            '<button type="button" class="MuiIconButton-card mui-ripple-host" data-share-url="' + esc(href) + '" data-share-title="' + esc(it.title) + '" aria-label="分享链接" title="复制报告链接">' +
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>' +
            '</button>' +
            '<a class="MuiIconButton-card mui-ripple-host" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer" aria-label="新窗口打开" title="新窗口打开报告">' +
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>' +
            '</a>' +
            '<button type="button" class="MuiIconButton-card MuiExpandMore mui-ripple-host' + (isExp ? ' Mui-expanded' : '') + '" data-expand-card="' + esc(it.id) + '" aria-expanded="' + (isExp ? 'true' : 'false') + '" aria-label="展开章节大纲" title="展开/收起章节大纲">' +
              '<svg width="23" height="23" viewBox="0 0 24 24" fill="currentColor"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>' +
            '</button>' +
          '</div>' +

          /* 5. Collapse Expandable Content */
          (isExp ? (
            '<div class="MuiCollapse-panel">' +
              '<div style="font-weight:500;color:var(--mui-text-primary);">核心章节大纲：</div>' +
              tocItems +
              '<div style="display:flex;justify-content:flex-end;gap:8px;">' +
                '<button type="button" class="MuiButton-root MuiButton-outlined mui-ripple-host" data-drawer-id="' + esc(it.id) + '">侧栏预览</button>' +
                '<a class="MuiButton-root MuiButton-containedPrimary mui-ripple-host" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">打开报告 ↗</a>' +
              '</div>' +
            '</div>'
          ) : '') +
        '</article>';
      }

      function updateLoadMoreFooter() {
        var foot = document.getElementById('loadMoreFooter');
        if (!foot) return;
        var total = currentFilteredList.length;
        if (renderedCardCount < total) {
          var nextBatch = Math.min(PAGE_SIZE, total - renderedCardCount);
          foot.innerHTML = '<button type="button" class="MuiButton-root MuiButton-outlined mui-ripple-host" data-load-more="1" style="height:36px;padding:0 20px;">' +
            '已展示 ' + renderedCardCount + ' / ' + total + ' 份 · 继续下滑自动加载（或点击加载下 ' + nextBatch + ' 份）' +
          '</button>';
        } else if (total > PAGE_SIZE) {
          foot.innerHTML = '<span style="font-size:0.8rem;color:var(--mui-text-hint);">已全部加载，共 ' + total + ' 份报告</span>';
        } else {
          foot.innerHTML = '';
        }
      }

      function appendNextBatch() {
        if (state.view !== 'list') return;
        var grid = document.getElementById('mainCardGrid');
        if (!grid) return;
        var total = currentFilteredList.length;
        if (renderedCardCount >= total) return;

        var tokens = getTokens();
        var nextEnd = Math.min(total, renderedCardCount + PAGE_SIZE);
        var slice = currentFilteredList.slice(renderedCardCount, nextEnd);
        var temp = document.createElement('div');
        temp.innerHTML = slice.map(function (it) { return renderFileCard(it, tokens); }).join('');
        var frag = document.createDocumentFragment();
        while (temp.firstChild) {
          frag.appendChild(temp.firstChild);
        }
        grid.appendChild(frag);
        renderedCardCount = nextEnd;
        state.visibleCount = renderedCardCount;
        updateLoadMoreFooter();
      }

      function setupScrollSentinel() {
        if (scrollObserver) {
          scrollObserver.disconnect();
          scrollObserver = null;
        }
        var sentinel = document.getElementById('loadMoreFooter');
        if (!sentinel || !('IntersectionObserver' in window)) return;
        scrollObserver = new IntersectionObserver(function (entries) {
          if (entries[0] && entries[0].isIntersecting && renderedCardCount < currentFilteredList.length) {
            appendNextBatch();
          }
        }, { rootMargin: '280px 0px' });
        scrollObserver.observe(sentinel);
      }

      function refreshSingleCard(cardId) {
        var existing = document.querySelector('[data-card-root="' + cardId + '"]');
        var it = itemById[cardId];
        if (!existing || !it) return false;
        var tmp = document.createElement('div');
        tmp.innerHTML = renderFileCard(it, getTokens());
        if (tmp.firstChild) {
          existing.parentNode.replaceChild(tmp.firstChild, existing);
          return true;
        }
        return false;
      }

      function renderListView(filtered) {
        var wrap = document.getElementById('viewList');
        var tokens = getTokens();
        var folders = getMatchingFolders(tokens);
        currentFilteredList = filtered;

        var folderBar = '';
        if (folders.length) {
          folderBar = '<div class="MuiAlert-standardInfo">' +
            '<strong style="color:var(--mui-primary-main);">匹配目录：</strong>' +
            folders.map(function (fn) {
              return '<button type="button" class="MuiButton-root MuiButton-outlined mui-ripple-host" style="height:28px;padding:0 10px;" data-jump-folder="' + esc(fn.id) + '">📁 ' + highlight(fn.relPath, tokens) + ' (' + countFolderFiles(fn.id) + ')</button>';
            }).join('') +
          '</div>';
        }

        if (!filtered.length) {
          renderedCardCount = 0;
          wrap.innerHTML = folderBar +
            '<div class="MuiPaper-elevation1" style="padding:48px 20px;text-align:center;color:var(--mui-text-secondary);">没有找到匹配的文件。<button type="button" class="MuiButton-root MuiButton-containedPrimary mui-ripple-host" style="margin-left:10px;" data-reset="1">重置筛选</button></div>';
          return;
        }

        var initialCount = Math.min(filtered.length, Math.max(PAGE_SIZE, state.visibleCount));
        renderedCardCount = initialCount;
        var initialSlice = filtered.slice(0, initialCount);

        wrap.innerHTML = folderBar +
          '<div id="mainCardGrid" class="MuiCardGrid">' +
            initialSlice.map(function (it) { return renderFileCard(it, tokens); }).join('') +
          '</div>' +
          '<div id="loadMoreFooter" class="MuiLoadMore-wrap"></div>';

        updateLoadMoreFooter();
        setupScrollSentinel();
      }

      function renderGroupedView(filtered) {
        var wrap = document.getElementById('viewGrouped');
        var tokens = getTokens();
        var byComp = {};
        filtered.forEach(function (it) {
          if (!byComp[it.company]) byComp[it.company] = [];
          byComp[it.company].push(it);
        });

        var companiesToShow = CATALOG.companies.filter(function (c) {
          if (state.company !== 'ALL' && c.folder !== state.company) return false;
          if (byComp[c.folder] && byComp[c.folder].length) return true;
          if (!tokens.length && state.category === 'ALL') return c.reportCount > 0;
          var hay = (c.folder + ' ' + c.label + ' ' + c.ticker).toLowerCase();
          return tokens.length > 0 && tokens.every(function (t) { return hay.indexOf(t) !== -1; });
        });

        if (!companiesToShow.length) {
          wrap.innerHTML = '<div class="MuiPaper-elevation1" style="padding:48px 20px;text-align:center;color:var(--mui-text-secondary);">没有匹配的公司分组</div>';
          return;
        }

        wrap.innerHTML = '<div style="display:flex;flex-direction:column;gap:24px;">' + companiesToShow.map(function (c) {
          var items = byComp[c.folder] || [];
          return '<section>' +
            '<div style="margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--mui-divider);display:flex;align-items:center;justify-content:space-between;gap:12px;">' +
              '<div style="display:flex;align-items:center;gap:8px;">' +
                '<span style="font-size:1.05rem;font-weight:500;">' + highlight(c.label, tokens) + '</span>' +
                '<span class="MuiMiniChip mono">' + highlight(c.ticker, tokens) + '</span>' +
                '<span style="font-size:0.8rem;color:var(--mui-text-secondary);">' + items.length + ' 份报告</span>' +
              '</div>' +
              '<a class="MuiButton-root MuiButton-outlined mui-ripple-host" href="' + esc(c.driveUrl) + '" target="_blank" rel="noopener noreferrer">文件夹 ↗</a>' +
            '</div>' +
            (items.length
              ? '<div class="MuiCardGrid">' + items.map(function (it) { return renderFileCard(it, tokens); }).join('') + '</div>'
              : '<div style="padding:16px 0;font-size:0.84rem;color:var(--mui-text-secondary);">当前筛选下暂无报告</div>') +
          '</section>';
        }).join('') + '</div>';
      }

      function renderTreeView() {
        var treeEl = document.getElementById('folderTreeContainer');
        var tokens = getTokens();
        var shown = 0;

        function visible(fid) {
          var n = folderNodes[fid];
          if (!n) return false;
          var cnt = countFolderFiles(fid);
          if (fid !== CATALOG.root.id && state.treeHideEmpty && cnt === 0) return false;
          if (!tokens.length) return true;
          var self = (n.name + ' ' + (n.label || '') + ' ' + n.relPath).toLowerCase();
          if (tokens.every(function (t) { return self.indexOf(t) !== -1; })) return true;
          for (var i = 0; i < n.files.length; i++) {
            var it = itemById[n.files[i]];
            if (it && tokens.every(function (t) { return (it.title + ' ' + it.name).toLowerCase().indexOf(t) !== -1; })) return true;
          }
          for (var j = 0; j < n.children.length; j++) {
            if (visible(n.children[j])) return true;
          }
          return false;
        }

        function draw(fid) {
          if (!visible(fid)) return '';
          var n = folderNodes[fid];
          shown += 1;
          var key = fid === CATALOG.root.id ? 'ROOT' : n.relPath;
          var open = tokens.length ? true : !!state.expanded[key];
          var hasSub = n.children.length > 0;
          var cnt = countFolderFiles(fid);
          var subHtml = '';
          if (hasSub && open) {
            var inner = n.children.map(draw).join('');
            if (inner) subHtml = '<div class="MuiTreeIndent">' + inner + '</div>';
          }
          return '<div>' +
            '<div class="MuiTreeItem' + (state.selectedFolderId === fid ? ' Mui-selected' : '') + '" data-tree-id="' + esc(fid) + '" data-exp="' + esc(key) + '">' +
              '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' +
                '<span class="mono" style="opacity:0.65;margin-right:4px;">' + (hasSub ? (open ? '▾' : '▸') : '·') + '</span>' +
                highlight(fid === CATALOG.root.id ? 'docs (根目录)' : n.name, tokens) +
              '</span>' +
              '<span class="MuiDrawer-badge mono">' + cnt + '</span>' +
            '</div>' +
            subHtml +
          '</div>';
        }

        treeEl.innerHTML = draw(CATALOG.root.id);
        var totalSubs = (CATALOG.stats && CATALOG.stats.totalSubfolders) || (Object.keys(folderNodes).length - 1);
        document.getElementById('treeStatsLabel').textContent = '显示 ' + Math.max(0, shown - 1) + ' / ' + totalSubs + ' 个子文件夹';
        renderFolderDetail(state.selectedFolderId);
      }

      function renderFolderDetail(fid) {
        var pane = document.getElementById('folderInspectorPane');
        var n = folderNodes[fid] || folderNodes[CATALOG.root.id];
        var tokens = getTokens();

        var subFolders = n.children.map(function (id) { return folderNodes[id]; }).filter(function (sf) {
          return sf && (!state.treeHideEmpty || countFolderFiles(sf.id) > 0);
        });

        var files = [];
        function collect(nodeId) {
          var cur = folderNodes[nodeId];
          if (!cur) return;
          cur.files.forEach(function (id) {
            var it = itemById[id];
            if (it && (state.includeSystem || (!it.isPortalIndex && !it.isSystem))) files.push(it);
          });
          cur.children.forEach(collect);
        }
        collect(n.id);

        var subsHtml = subFolders.length ? (
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;">' +
            subFolders.map(function (sf) {
              return '<button type="button" class="MuiButton-root MuiButton-outlined mui-ripple-host" data-sel-folder="' + esc(sf.id) + '">📁 ' + esc(sf.name) + ' (' + countFolderFiles(sf.id) + ')</button>';
            }).join('') +
          '</div>'
        ) : '';

        pane.innerHTML =
          '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--mui-divider);">' +
            '<div class="mono" style="font-size:0.95rem;font-weight:500;">' + esc(n.relPath ? 'docs/' + n.relPath + '/' : 'docs/') + '</div>' +
            '<div style="display:flex;gap:8px;">' +
              (n.parentId ? '<button type="button" class="MuiButton-root MuiButton-outlined mui-ripple-host" data-sel-folder="' + esc(n.parentId) + '">↑ 上级</button>' : '') +
              '<a class="MuiButton-root MuiButton-outlinedPrimary mui-ripple-host" href="' + esc(n.driveUrl) + '" target="_blank" rel="noopener noreferrer">云端打开目录 ↗</a>' +
            '</div>' +
          '</div>' +
          subsHtml +
          (files.length
            ? '<div class="MuiCardGrid" style="margin-top:12px;">' + files.map(function (it) { return renderFileCard(it, tokens); }).join('') + '</div>'
            : '<div style="padding:36px 12px;text-align:center;color:var(--mui-text-secondary);">该文件夹当前为空预留目录</div>');
      }

      function openDrawer(id) {
        var it = itemById[id];
        if (!it) return;
        var sz = fmtSize(it.size);
        document.getElementById('drawerMeta').textContent = it.companyLabel + ' · ' + (CAT_LABELS[it.category] || it.category) + (sz ? ' · ' + sz : '');
        document.getElementById('drawerTitle').textContent = it.title;

        var localHref = encodeRel(it.relPath);
        var primaryHref = resolveUrl(it);

        var previewBlock = '';
        if (isLocalEnv()) {
          previewBlock = '<iframe class="MuiPreviewFrame" src="' + esc(localHref) + '" title="' + esc(it.name) + '"></iframe>';
        } else {
          var toc = (it.headings || []).length
            ? '<div class="MuiPaper-outlined">' + it.headings.map(function (h, i) {
                return '<div style="padding:9px 14px;' + (i > 0 ? 'border-top:1px solid var(--mui-divider);' : '') + 'font-size:0.84rem;color:var(--mui-text-primary);">' + esc(h) + '</div>';
              }).join('') + '</div>'
            : '<div style="font-size:0.84rem;color:var(--mui-text-secondary);">暂无提取章节</div>';
          previewBlock =
            (it.summary ? '<div class="MuiPaper-outlined" style="padding:12px 14px;background-color:var(--mui-bg-level2);font-size:0.85rem;line-height:1.65;color:var(--mui-text-secondary);">' + esc(it.summary) + '</div>' : '') +
            '<div><div style="font-size:0.8rem;font-weight:500;color:var(--mui-text-secondary);margin-bottom:8px;">报告核心章节大纲</div>' + toc + '</div>';
        }

        document.getElementById('drawerBody').innerHTML =
          '<div class="MuiDrawer-actionGrid">' +
            '<a class="MuiButton-root MuiButton-containedPrimary mui-ripple-host" href="' + esc(primaryHref) + '" target="_blank" rel="noopener noreferrer">新窗口打开文件 ↗</a>' +
            '<a class="MuiButton-root MuiButton-outlined mui-ripple-host" href="' + esc(it.driveUrl) + '" target="_blank" rel="noopener noreferrer">Google Drive 打开</a>' +
          '</div>' +
          previewBlock;

        document.getElementById('detailDrawerBackdrop').classList.add('open');
      }

      function closeDrawer() {
        document.getElementById('detailDrawerBackdrop').classList.remove('open');
      }

      function closeMobileNav() {
        document.getElementById('leftMuiDrawer').classList.remove('mobile-open');
        document.getElementById('mobileNavBackdrop').classList.remove('open');
      }


      function applyTheme() {
        document.documentElement.setAttribute('data-mui-theme', state.theme);
        document.getElementById('themeIcon').textContent = state.theme === 'light' ? '深色' : '浅色';
      }

      function refreshHeaderCounts() {
        var repTotal = allItems.filter(function (it) { return !it.isPortalIndex && !it.isSystem; }).length;
        var compTotal = CATALOG.companies.length;
        var hs = document.getElementById('headerStatsText');
        if (hs) hs.textContent = compTotal + ' 个目录 · ' + repTotal + ' 份报告';
        var sct = document.getElementById('sidebarCompTotal');
        if (sct) sct.textContent = String(compTotal);

        var compSel = document.getElementById('companySelect');
        var curVal = compSel.value || 'ALL';
        compSel.innerHTML = '<option value="ALL">全部公司 (' + compTotal + ')</option>';
        CATALOG.companies.forEach(function (c) {
          var opt = document.createElement('option');
          opt.value = c.folder;
          opt.textContent = c.folder + ' (' + c.reportCount + ')';
          compSel.appendChild(opt);
        });
        compSel.value = companyByName[curVal] ? curVal : 'ALL';
      }

      function render() {
        var filtered = getFiltered();
        document.getElementById('resultCountText').textContent = filtered.length + ' 份';

        var clearBtn = document.getElementById('clearSearchBtn');
        if (state.query.trim()) clearBtn.classList.remove('hidden');
        else clearBtn.classList.add('hidden');

        document.querySelectorAll('[data-view]').forEach(function (b) {
          b.classList.toggle('Mui-selected', b.getAttribute('data-view') === state.view);
        });

        document.getElementById('viewList').classList.toggle('hidden', state.view !== 'list');
        document.getElementById('viewGrouped').classList.toggle('hidden', state.view !== 'grouped');
        document.getElementById('viewTree').classList.toggle('hidden', state.view !== 'tree');

        var drawerOpenNow = document.body.classList.contains('pc-drawer-open') || document.getElementById('leftMuiDrawer').classList.contains('mobile-open');
        if (drawerOpenNow) {
          renderSidebar();
          state.sidebarRendered = true;
        } else {
          state.sidebarRendered = false;
        }
        renderCategoryTabs();

        if (state.view === 'list') renderListView(filtered);
        else if (state.view === 'grouped') renderGroupedView(filtered);
        else renderTreeView();
      }

      function init() {
        var compSel = document.getElementById('companySelect');
        refreshHeaderCounts();
        applyTheme();

        var input = document.getElementById('globalSearchInput');
        var searchRaf = 0;
        input.addEventListener('input', function (e) {
          state.query = e.target.value || '';
          state.visibleCount = PAGE_SIZE;
          if (searchRaf) window.cancelAnimationFrame(searchRaf);
          searchRaf = window.requestAnimationFrame(function () {
            render();
          });
        });

        document.getElementById('clearSearchBtn').addEventListener('click', function () {
          state.query = '';
          state.visibleCount = PAGE_SIZE;
          input.value = '';
          input.focus();
          render();
        });

        // Fallback window scroll listener + touch pull-to-refresh at top
        window.addEventListener('scroll', function () {
          if (state.view === 'list' && renderedCardCount < currentFilteredList.length) {
            var remain = document.documentElement.scrollHeight - (window.scrollY + window.innerHeight);
            if (remain < 320) appendNextBatch();
          }
        }, { passive: true });

        var touchStartY = 0;
        var pulling = false;
        var pullBar = document.getElementById('pullRefreshBar');
        window.addEventListener('touchstart', function (e) {
          if (window.scrollY <= 2 && e.touches && e.touches[0]) {
            touchStartY = e.touches[0].clientY;
            pulling = true;
          } else {
            pulling = false;
          }
        }, { passive: true });
        window.addEventListener('touchmove', function (e) {
          if (!pulling || !e.touches || !e.touches[0]) return;
          var dy = e.touches[0].clientY - touchStartY;
          if (dy > 55 && window.scrollY <= 0) {
            pullBar.classList.add('active');
          }
        }, { passive: true });
        window.addEventListener('touchend', function () {
          if (pullBar.classList.contains('active')) {
            pullBar.classList.remove('active');
            state.visibleCount = PAGE_SIZE;
            render();
            toast('已刷新最新 15 份文档');
          }
          pulling = false;
        }, { passive: true });

        document.addEventListener('keydown', function (e) {
          var tag = document.activeElement ? document.activeElement.tagName : '';
          if ((e.key === '/' && tag !== 'INPUT' && tag !== 'SELECT') || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) {
            e.preventDefault();
            input.focus();
            input.select();
          } else if (e.key === 'Escape') {
            if (document.getElementById('detailDrawerBackdrop').classList.contains('open')) closeDrawer();
            else if (document.getElementById('leftMuiDrawer').classList.contains('mobile-open')) closeMobileNav();
            else if (state.query) {
              state.query = '';
              input.value = '';
              render();
            }
          }
        });

        document.getElementById('mobileDrawerToggleBtn').addEventListener('click', function () {
          if (window.innerWidth >= 960) {
            document.body.classList.toggle('pc-drawer-open');
          } else {
            document.getElementById('leftMuiDrawer').classList.toggle('mobile-open');
            document.getElementById('mobileNavBackdrop').classList.toggle('open');
          }
          if (!state.sidebarRendered) {
            renderSidebar();
            state.sidebarRendered = true;
          }
        });
        document.getElementById('mobileNavBackdrop').addEventListener('click', closeMobileNav);

        compSel.addEventListener('change', function (e) {
          state.company = e.target.value;
          state.visibleCount = PAGE_SIZE;
          render();
        });

        document.getElementById('sortSelect').addEventListener('change', function (e) {
          state.sort = e.target.value;
          state.visibleCount = PAGE_SIZE;
          render();
        });

        document.getElementById('themeToggleBtn').addEventListener('click', function () {
          state.theme = state.theme === 'light' ? 'dark' : 'light';
          saveStore('docs_mui_theme_v2', state.theme);
          applyTheme();
        });

        document.getElementById('treeHideEmptyBtn').addEventListener('click', function (e) {
          state.treeHideEmpty = !state.treeHideEmpty;
          e.currentTarget.className = state.treeHideEmpty
            ? 'MuiButton-root MuiButton-containedPrimary mui-ripple-host'
            : 'MuiButton-root MuiButton-outlined mui-ripple-host';
          var totalSubs2 = (CATALOG.stats && CATALOG.stats.totalSubfolders) || (Object.keys(folderNodes).length - 1);
          e.currentTarget.textContent = state.treeHideEmpty ? '仅显示含文件目录' : ('显示全部 ' + totalSubs2 + ' 个目录');
          renderTreeView();
        });

        document.getElementById('sysFilesToggleBtn').addEventListener('click', function (e) {
          state.includeSystem = !state.includeSystem;
          e.currentTarget.className = state.includeSystem
            ? 'MuiButton-root MuiButton-containedPrimary mui-ripple-host'
            : 'MuiButton-root MuiButton-outlined mui-ripple-host';
          render();
        });

        document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawer);
        document.getElementById('detailDrawerBackdrop').addEventListener('click', function (e) {
          if (e.target === e.currentTarget) closeDrawer();
        });

        document.body.addEventListener('click', function (e) {
          var rippleHost = e.target.closest('.mui-ripple-host');
          if (rippleHost) {
            spawnRipple(rippleHost, e);
          }

          var sideAllBtn = e.target.closest('[data-side-comp]');
          if (sideAllBtn) {
            state.company = 'ALL';
            state.category = 'ALL';
            state.visibleCount = PAGE_SIZE;
            compSel.value = 'ALL';
            if (window.innerWidth < 960) closeMobileNav();
            render();
            return;
          }

          var navCompBtn = e.target.closest('[data-nav-company]');
          if (navCompBtn) {
            var cname = navCompBtn.getAttribute('data-nav-company');
            state.navOpen[cname] = !state.navOpen[cname];
            state.company = cname;
            state.category = 'ALL';
            state.visibleCount = PAGE_SIZE;
            compSel.value = cname;
            if (state.view === 'tree' && companyByName[cname]) {
              state.selectedFolderId = companyByName[cname].id;
              state.expanded[cname] = true;
            }
            render();
            return;
          }

          var navFoldBtn = e.target.closest('[data-nav-folder]');
          if (navFoldBtn) {
            var nfid = navFoldBtn.getAttribute('data-nav-folder');
            var nkey = navFoldBtn.getAttribute('data-nav-key');
            state.navOpen[nkey] = !state.navOpen[nkey];
            var segs = nkey.split('/');
            if (segs[0] && companyByName[segs[0]]) {
              state.company = segs[0];
              compSel.value = segs[0];
            }
            if (segs[1] && CAT_LABELS[segs[1]]) {
              state.category = segs[1];
            }
            state.visibleCount = PAGE_SIZE;
            if (state.view === 'tree') {
              state.selectedFolderId = nfid;
              state.expanded[nkey] = true;
            }
            render();
            return;
          }

          var navLeaf = e.target.closest('[data-nav-leaf]');
          if (navLeaf && window.innerWidth < 960) {
            closeMobileNav();
            return;
          }

          var loadMoreBtn = e.target.closest('[data-load-more]');
          if (loadMoreBtn) {
            appendNextBatch();
            return;
          }

          var expCardBtn = e.target.closest('[data-expand-card]');
          if (expCardBtn) {
            var ecid = expCardBtn.getAttribute('data-expand-card');
            if (state.expandedCards[ecid]) delete state.expandedCards[ecid];
            else state.expandedCards[ecid] = true;
            if (!refreshSingleCard(ecid)) render();
            return;
          }

          var shareBtn = e.target.closest('[data-share-url]');
          if (shareBtn) {
            var sUrl = shareBtn.getAttribute('data-share-url');
            if (sUrl.indexOf('./') === 0) {
              try { sUrl = new URL(sUrl, window.location.href).href; } catch (err) {}
            }
            copyPath(sUrl);
            return;
          }

          var starBtn = e.target.closest('[data-star-id]');
          if (starBtn) {
            var sid = starBtn.getAttribute('data-star-id');
            if (state.favorites[sid]) delete state.favorites[sid];
            else state.favorites[sid] = true;
            saveStore('docs_clean_favs', state.favorites);
            if (state.category === 'FAV' || !refreshSingleCard(sid)) {
              render();
            } else {
              renderCategoryTabs();
            }
            return;
          }

          var vBtn = e.target.closest('[data-view]');
          if (vBtn) {
            state.view = vBtn.getAttribute('data-view');
            render();
            return;
          }

          var cBtn = e.target.closest('[data-cat]');
          if (cBtn) {
            state.category = cBtn.getAttribute('data-cat');
            state.visibleCount = PAGE_SIZE;
            render();
            return;
          }

          var dBtn = e.target.closest('[data-drawer-id]');
          if (dBtn) {
            openDrawer(dBtn.getAttribute('data-drawer-id'));
            return;
          }

          var cpBtn = e.target.closest('[data-copy]');
          if (cpBtn) {
            copyPath(cpBtn.getAttribute('data-copy'));
            return;
          }

          var rstBtn = e.target.closest('[data-reset]');
          if (rstBtn) {
            state.query = '';
            state.category = 'ALL';
            state.company = 'ALL';
            input.value = '';
            compSel.value = 'ALL';
            render();
            return;
          }

          var jmpBtn = e.target.closest('[data-jump-folder]');
          if (jmpBtn) {
            var jid = jmpBtn.getAttribute('data-jump-folder');
            var jn = folderNodes[jid];
            if (jn) {
              state.view = 'tree';
              state.treeHideEmpty = false;
              var hb = document.getElementById('treeHideEmptyBtn');
              hb.className = 'MuiButton-root MuiButton-outlined mui-ripple-host';
              hb.textContent = '显示全部 ' + ((CATALOG.stats && CATALOG.stats.totalSubfolders) || (Object.keys(folderNodes).length - 1)) + ' 个目录';
              state.selectedFolderId = jid;
              var acc = '';
              jn.relPath.split('/').forEach(function (seg) {
                acc = acc ? acc + '/' + seg : seg;
                state.expanded[acc] = true;
              });
              render();
            }
            return;
          }

          var tItem = e.target.closest('[data-tree-id]');
          if (tItem) {
            var fid = tItem.getAttribute('data-tree-id');
            var exp = tItem.getAttribute('data-exp');
            if (state.selectedFolderId === fid && fid !== CATALOG.root.id) {
              state.expanded[exp] = !state.expanded[exp];
            } else {
              state.expanded[exp] = true;
            }
            state.selectedFolderId = fid;
            renderTreeView();
            return;
          }

          var sBtn = e.target.closest('[data-sel-folder]');
          if (sBtn) {
            var sfid = sBtn.getAttribute('data-sel-folder');
            var sn = folderNodes[sfid];
            if (sn) {
              state.selectedFolderId = sfid;
              if (sn.relPath) state.expanded[sn.relPath] = true;
              renderTreeView();
            }
          }
        });

        render();
      }

      init();
    })();
  </script>
</body>
</html>
